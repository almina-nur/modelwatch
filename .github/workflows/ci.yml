name: ModelWatch CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint and format check with ruff
        run: |
          ruff check src api tests
          ruff format --check src api tests

      - name: Train and register staging model
        run: python -m src.train

      - name: Run pytest
        run: pytest -v

      - name: Build Docker image and smoke test /health
        run: |
          docker build -t modelwatch:ci .
          docker run -d --name modelwatch-ci -p 8000:8000 modelwatch:ci
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "Container is healthy"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:8000/health | grep -q '"model_ready":true'

      - name: Clean up smoke container
        if: always()
        run: docker rm -f modelwatch-ci || true
