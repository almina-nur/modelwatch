[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "modelwatch"
version = "1.3.0"
description = "ML model monitoring, data drift detection, alerting, and inference service"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pandas<3.0",
    "numpy",
    "scikit-learn",
    "mlflow>=3.0",
    "evidently==0.7.23",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "api*"]
