[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "modelwatch"
version = "1.4.0"
description = "ML model monitoring, data drift detection, alerting, and inference service"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pandas<3.0",
    "numpy",
    "scikit-learn",
    "mlflow>=3.0",
    "evidently==0.7.23",
    "urllib3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "api*"]

[tool.pytest.ini_options]
addopts = "-v --cov=src --cov=api --cov-report=term-missing"
